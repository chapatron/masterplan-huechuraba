          polygonCoords: `700,${ySlot} 735,${ySlot} 735,${ySlot + 14} 700,${ySlot + 14}`
        });
      }

      return unidades;
    }

    function MasterPlanApp() {
      const [inventario, setInventario] = React.useState(generarInventarioInicial);
      const [plantaActiva, setPlantaActiva] = React.useState('P1');
      const [unidadSeleccionadaId, setUnidadSeleccionadaId] = React.useState(null);
      const [hoverUnidad, setHoverUnidad] = React.useState(null);
      const [generandoPDF, setGenerandoPDF] = React.useState(false);
      const [guardandoEnSheets, setGuardandoEnSheets] = React.useState(false);
      const [dataUrlImagen, setDataUrlImagen] = React.useState(null);

      // Valor UF Automatizado
      const [valorUF, setValorUF] = React.useState(39500);
      const [ufSincronizada, setUfSincronizada] = React.useState(false);
      const [cargandoUF, setCargandoUF] = React.useState(false);

      // Filtros rápidos
      const [filtroEstado, setFiltroEstado] = React.useState('todos');
      const [filtroDisposicion, setFiltroDisposicion] = React.useState('todas');
      const [precioMaximo, setPrecioMaximo] = React.useState(6500);

      // Simulador Financiero
      const [pctPie, setPctPie] = React.useState(20);
      const [montoReservaUF, setMontoReservaUF] = React.useState(50);
      const [cuotasPie, setCuotasPie] = React.useState(24);
      const [tasaHipotecarioAnual, setTasaHipotecarioAnual] = React.useState(4.50);
      const [plazoCreditoAnios, setPlazoCreditoAnios] = React.useState(25);

      const unidadSeleccionada = React.useMemo(() => 
        inventario.find(u => u.id === unidadSeleccionadaId) || null,
        [inventario, unidadSeleccionadaId]
      );

      const [formLead, setFormLead] = React.useState({
        nombre: '',
        rut: '',
        email: '',
        telefono: '',
        etapa: 'Contacto Inicial',
        observaciones: ''
      });

      // Consulta automática de UF del día en Chile
      const obtenerUFDelDia = React.useCallback(() => {
        setCargandoUF(true);
        fetch('https://mindicador.cl/api/uf')
          .then(res => res.json())
          .then(data => {
            if (data && Array.isArray(data.serie) && data.serie.length > 0) {
              const valorActual = Math.round(data.serie[0].valor * 100) / 100;
              setValorUF(valorActual);
              setUfSincronizada(true);
            }
            setCargandoUF(false);
          })
          .catch(() => {
            setCargandoUF(false);
            setUfSincronizada(false);
          });
      }, []);

      React.useEffect(() => {
        obtenerUFDelDia();
      }, [obtenerUFDelDia]);

      const ocupacionComplementarios = React.useMemo(() => {
        const bodOcupadas = {};
        const est2Ocupados = {};
        inventario.forEach(u => {
          if (u.tipo.includes('Duplex') && u.estado !== 'disponible') {
            if (u.bodegaAsignadaId) bodOcupadas[u.bodegaAsignadaId] = u.id;
            if (u.segundoEstacionamientoId) est2Ocupados[u.segundoEstacionamientoId] = u.id;
          }
        });
        return { bodOcupadas, est2Ocupados };
      }, [inventario]);

      const calculosFinancieros = React.useMemo(() => {
        if (!unidadSeleccionada) return {
          base: 0, est: 0, est2: 0, bod: 0, total: 0, totalCLP: 0,
          est1Info: null, est2Info: null, bodInfo: null,
          montoPieUF: 0, saldoPieUF: 0, cuotaMensualPieUF: 0, cuotaMensualPieCLP: 0,
          montoCreditoUF: 0, dividendoUF: 0, dividendoCLP: 0, rentaSugeridaCLP: 0
        };

        const base = unidadSeleccionada.precioUF || 0;

        // Estacionamiento 1 (Todos a 350 UF)
        let est = 0;
        let est1Info = null;
        if (unidadSeleccionada.estacionamientoAsignadoId) {
          const num1 = Number(unidadSeleccionada.estacionamientoAsignadoId.replace('EST-', ''));
          est1Info = DATOS_ESTACIONAMIENTOS_EXCEL[num1];
          est = est1Info ? est1Info.precioDif : 350;
        }

        // Estacionamiento 2 opcional (Techados: 400 UF, Semitechados: 375 UF, Descubiertos: 350 UF)
        let est2 = 0;
        let est2Info = null;
        if (unidadSeleccionada.segundoEstacionamientoId) {
          const num2 = Number(unidadSeleccionada.segundoEstacionamientoId.replace('EST-', ''));
          est2Info = DATOS_ESTACIONAMIENTOS_EXCEL[num2];
          est2 = est2Info ? est2Info.precioDif : 350;
        }

        // Bodega elegida (escala progresiva 90 - 150 UF)
        let bod = 0;
        let bodInfo = null;
        if (unidadSeleccionada.bodegaAsignadaId) {
          const numBod = Number(unidadSeleccionada.bodegaAsignadaId.replace('BOD-', ''));
          bodInfo = DATOS_BODEGAS_EXCEL[numBod];
          bod = bodInfo ? bodInfo.precioUF : 90;
        }

        const total = base + est + est2 + bod;
        const totalCLP = Math.round(total * valorUF);

        // Plan de Pie
        const montoPieUF = total * (pctPie / 100);
        const saldoPieUF = Math.max(0, montoPieUF - montoReservaUF);
        const cuotaMensualPieUF = cuotasPie > 0 ? saldoPieUF / cuotasPie : 0;
        const cuotaMensualPieCLP = Math.round(cuotaMensualPieUF * valorUF);

        // Crédito Hipotecario
        const montoCreditoUF = total * (1 - (pctPie / 100));
        const numMeses = plazoCreditoAnios * 12;
        const tasaMensual = Math.pow(1 + (tasaHipotecarioAnual / 100), 1 / 12) - 1;

        let dividendoUF = 0;
        if (tasaMensual > 0 && numMeses > 0) {
          dividendoUF = montoCreditoUF * ((tasaMensual * Math.pow(1 + tasaMensual, numMeses)) / (Math.pow(1 + tasaMensual, numMeses) - 1));
        }
        const dividendoCLP = Math.round(dividendoUF * valorUF);
        const rentaSugeridaCLP = dividendoCLP * 4;

        return {
          base, est, est2, bod, total, totalCLP,
          est1Info, est2Info, bodInfo,
          montoPieUF, saldoPieUF, cuotaMensualPieUF, cuotaMensualPieCLP,
          montoCreditoUF, dividendoUF, dividendoCLP, rentaSugeridaCLP
        };
      }, [unidadSeleccionada, valorUF, pctPie, montoReservaUF, cuotasPie, tasaHipotecarioAnual, plazoCreditoAnios]);

      React.useEffect(() => {
        if (unidadSeleccionada && unidadSeleccionada.imgTipologia) {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            setDataUrlImagen(canvas.toDataURL('image/png'));
          };
          img.onerror = () => setDataUrlImagen(null);
          img.src = unidadSeleccionada.imgTipologia;
        } else {
          setDataUrlImagen(null);
        }
      }, [unidadSeleccionadaId]);

      React.useEffect(() => {
        if (!APPS_SCRIPT_URL) return;
        fetch(APPS_SCRIPT_URL)
          .then(res => res.json())
          .then(dataNube => {
            if (Array.isArray(dataNube) && dataNube.length > 0) {
              setInventario(prev => prev.map(u => {
                const itemNube = dataNube.find(d => d.id === u.id);
                if (itemNube) {
                  return {
                    ...u,
                    estado: itemNube.estado || u.estado,
                    precioUF: itemNube.precioUF ? Number(itemNube.precioUF) : u.precioUF,
                    lead: itemNube.lead && itemNube.lead.nombre ? itemNube.lead : u.lead
                  };
                }
                return u;
              }));
            }
          })
          .catch(() => {});
      }, []);

      const exportarACSV = () => {
        const ordenTipos = (tipo) => {
          if (tipo.includes('Duplex')) return 1;
          if (tipo === 'Estacionamiento') return 2;
          if (tipo === 'Bodega') return 3;
          return 4;
        };

        const inventarioOrdenado = [...inventario].sort((a, b) => {
          const ordenA = ordenTipos(a.tipo);
          const ordenB = ordenTipos(b.tipo);
          if (ordenA !== ordenB) return ordenA - ordenB;
          return a.numero - b.numero;
        });

        const encabezados = [
          'ID Unidad', 'Tipo', 'Tipologia Arquitectonica', 'Nivel',
          'Superficie Util (m2)', 'Superficie Exterior (m2)',
          'Estacionamiento 1', 'Estacionamiento 2', 'Bodega', 'Precio Depto (UF)',
          'Total Inversion (UF)', 'Total Inversion (CLP)', 'Estado', 'Nombre Cliente',
          'RUT', 'Email', 'Telefono', 'Etapa Comercial', 'Observaciones'
        ];

        const filas = inventarioOrdenado.map(u => {
          let totalInv = u.precioUF;
          if (u.tipo.includes('Duplex')) {
            const num1 = u.estacionamientoAsignadoId ? Number(u.estacionamientoAsignadoId.replace('EST-', '')) : 0;
            const pEst1 = num1 && DATOS_ESTACIONAMIENTOS_EXCEL[num1] ? DATOS_ESTACIONAMIENTOS_EXCEL[num1].precioDif : 0;
            const num2 = u.segundoEstacionamientoId ? Number(u.segundoEstacionamientoId.replace('EST-', '')) : 0;
            const pEst2 = num2 && DATOS_ESTACIONAMIENTOS_EXCEL[num2] ? DATOS_ESTACIONAMIENTOS_EXCEL[num2].precioDif : 0;
            const numB = u.bodegaAsignadaId ? Number(u.bodegaAsignadaId.replace('BOD-', '')) : 0;
            const pBod = numB && DATOS_BODEGAS_EXCEL[numB] ? DATOS_BODEGAS_EXCEL[numB].precioUF : 0;
            totalInv = u.precioUF + pEst1 + pEst2 + pBod;
          }
          const totalCLP = Math.round(totalInv * valorUF);
          return [
            `"${u.id}"`, `"${u.tipo}"`, `"${u.nombreTipologia || ''}"`, `"${u.nivel}"`,
            u.superficieUtil !== null ? u.superficieUtil : '""',
            u.metrajeExterior !== undefined ? u.metrajeExterior : '""',
            `"${u.estacionamientoAsignadoId || ''}"`,
            `"${u.segundoEstacionamientoId || ''}"`,
            `"${u.bodegaAsignadaId || ''}"`,
            u.precioUF, totalInv, totalCLP, `"${u.estado}"`,
            `"${u.lead ? u.lead.nombre : ''}"`, `"${u.lead ? u.lead.rut : ''}"`,
            `"${u.lead ? u.lead.email : ''}"`, `"${u.lead ? u.lead.telefono : ''}"`,
            `"${u.lead ? u.lead.etapa : ''}"`,
            `"${((u.lead && u.lead.observaciones) || '').replace(/"/g, '""')}"`
          ];
        });

        const contenidoCSV = [
          encabezados.join(';'),
          ...filas.map(f => f.join(';'))
        ].join('\r\n');

        const blob = new Blob(['\uFEFF' + contenidoCSV], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `MasterPlan_Huechuraba_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const seleccionarUnidad = (u) => {
        setUnidadSeleccionadaId(u.id);
        if (u.lead) {
          setFormLead(u.lead);
        } else {
          setFormLead({
            nombre: '', rut: '', email: '', telefono: '',
            etapa: 'Contacto Inicial', observaciones: ''
          });
        }
      };

      const enviarASheetsYCorreo = (payload) => {
        if (!APPS_SCRIPT_URL) return;
        setGuardandoEnSheets(true);

        const formData = new FormData();
        formData.append("datos", JSON.stringify(payload));

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData,
          mode: 'no-cors'
        }).then(() => {
          setTimeout(() => setGuardandoEnSheets(false), 900);
        }).catch(() => {
          setGuardandoEnSheets(false);
        });
      };

      const sincronizarInventarioYComplementarios = (unidadMod, nuevoEstado) => {
        const idsAfectados = [
          unidadMod.id,
          unidadMod.estacionamientoAsignadoId,
          unidadMod.segundoEstacionamientoId,
          unidadMod.bodegaAsignadaId
        ].filter(Boolean);

        setInventario(prev => prev.map(u => {
          if (u.id === unidadMod.id) return unidadMod;
          if (idsAfectados.includes(u.id)) {
            return {
              ...u,
              estado: nuevoEstado,
              lead: unidadMod.lead
            };
          }
          return u;
        }));
      };

      const cambiarEstadoUnidad = (nuevoEstado) => {
        if (!unidadSeleccionadaId || !unidadSeleccionada) return;
        const unidadMod = { 
          ...unidadSeleccionada, 
          estado: nuevoEstado, 
          lead: formLead,
          totalUF: calculosFinancieros.total
        };
        sincronizarInventarioYComplementarios(unidadMod, nuevoEstado);
        enviarASheetsYCorreo(unidadMod);
      };

      const actualizarPrecioUnidad = (nuevoPrecio) => {
        const valorNumerico = parseFloat(nuevoPrecio) || 0;
        const unidadMod = { 
          ...unidadSeleccionada, 
          precioUF: valorNumerico,
          totalUF: valorNumerico + calculosFinancieros.est + calculosFinancieros.est2 + calculosFinancieros.bod
        };
        setInventario(prev => prev.map(u => u.id === unidadSeleccionadaId ? unidadMod : u));
        enviarASheetsYCorreo(unidadMod);
      };

      const toggleSegundoEstacionamiento = (checked) => {
        const primerLibre = ESTACIONAMIENTOS_LIBRES[0] ? `EST-${String(ESTACIONAMIENTOS_LIBRES[0]).padStart(2, '0')}` : null;
        const nuevoSegundoEst = checked ? primerLibre : null;
        setInventario(prev => prev.map(u => u.id === unidadSeleccionadaId ? { ...u, segundoEstacionamientoId: nuevoSegundoEst } : u));
      };

      const cambiarIdSegundoEstacionamiento = (idEst) => {
        setInventario(prev => prev.map(u => u.id === unidadSeleccionadaId ? { ...u, segundoEstacionamientoId: idEst } : u));
      };

      const cambiarBodegaSeleccionada = (idBod) => {
        setInventario(prev => prev.map(u => u.id === unidadSeleccionadaId ? { ...u, bodegaAsignadaId: idBod || null } : u));
      };

      const actualizarPatioUnidad = (nuevoPatio) => {
        const valorNumerico = parseFloat(nuevoPatio) || 0;
        setInventario(prev => prev.map(u => u.id === unidadSeleccionadaId ? { ...u, metrajeExterior: valorNumerico } : u));
      };

      const guardarLeadYDescargarPDF = (ev) => {
        ev.preventDefault();
        if (!unidadSeleccionadaId || !unidadSeleccionada) return;

        const estInfo = unidadSeleccionada.segundoEstacionamientoId 
          ? `${unidadSeleccionada.estacionamientoAsignadoId} y ${unidadSeleccionada.segundoEstacionamientoId}`
          : unidadSeleccionada.estacionamientoAsignadoId;

        const nuevoEstado = (unidadSeleccionada.estado === 'disponible' || unidadSeleccionada.estado === 'contacto')
          ? 'cotizada' 
          : unidadSeleccionada.estado;

        const leadActualizado = {
          ...formLead,
          etapa: formLead.etapa === 'Contacto Inicial' ? 'Cotización' : formLead.etapa
        };

        const unidadMod = {
          ...unidadSeleccionada,
          lead: leadActualizado,
          estado: nuevoEstado,
          totalUF: calculosFinancieros.total,
          totalCLP: calculosFinancieros.totalCLP,
          tipologia: unidadSeleccionada.nombreTipologia,
          estacionamientoId: estInfo,
          bodegaId: unidadSeleccionada.bodegaAsignadaId,
          est1Id: unidadSeleccionada.estacionamientoAsignadoId,
          est2Id: unidadSeleccionada.segundoEstacionamientoId,
          bodId: unidadSeleccionada.bodegaAsignadaId
        };

        sincronizarInventarioYComplementarios(unidadMod, nuevoEstado);
        setFormLead(leadActualizado);

        if (unidadSeleccionada.tipo.includes('Duplex')) {
          setGenerandoPDF(true);
          setTimeout(() => {
            const elemento = document.getElementById('plantilla-ficha-pdf');
            if (elemento && window.html2pdf) {
              const opt = {
                margin: 6,
                filename: `Cotizacion_${unidadSeleccionada.id}_${(leadActualizado.nombre || 'Cliente').replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, allowTaint: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
              };

              window.html2pdf().set(opt).from(elemento).outputPdf('datauristring').then((pdfDataUri) => {
                const base64Data = pdfDataUri.split(',')[1];
                unidadMod.pdfBase64 = base64Data;
                enviarASheetsYCorreo(unidadMod);

                window.html2pdf().set(opt).from(elemento).save().then(() => {
                  setGenerandoPDF(false);
                });
              }).catch(() => {
                setGenerandoPDF(false);
                enviarASheetsYCorreo(unidadMod);
              });
            } else {
              setGenerandoPDF(false);
              enviarASheetsYCorreo(unidadMod);
            }
          }, 400);
        } else {
          enviarASheetsYCorreo(unidadMod);
        }
      };

      const unidadPasaFiltros = (item) => {
        if (filtroEstado !== 'todos' && item.estado !== filtroEstado) return false;
        if (item.tipo.includes('Duplex')) {
          if (filtroDisposicion === 'esquina' && !item.nombreTipologia.toLowerCase().includes('esquina')) return false;
          if (filtroDisposicion === 'central' && item.nombreTipologia.toLowerCase().includes('esquina')) return false;
          if (item.precioUF > precioMaximo) return false;
        }
        return true;
      };

      const itemsFiltradosPlanta = inventario.filter(item => {
        if (plantaActiva === 'P1') return item.tipo === 'Duplex Garden';
        if (plantaActiva === 'P4') return item.tipo === 'Duplex Rooftop';
        if (plantaActiva === 'SUB') return item.nivel === 'Subterráneo';
        return true;
      });

      const getColorPorEstado = (estado, tipo, cumpleFiltros) => {
        if (!cumpleFiltros) {
          return 'fill-slate-900/30 stroke-slate-800 opacity-20';
        }

        if (tipo === 'Bodega') {
          switch (estado) {
            case 'disponible': return 'fill-cyan-500/50 stroke-cyan-400 hover:fill-cyan-400/70';
            case 'contacto': return 'fill-sky-500/50 stroke-sky-400 hover:fill-sky-400/70';
            case 'cotizada': return 'fill-violet-500/65 stroke-violet-300 hover:fill-violet-400/80';
            case 'reservada': return 'fill-amber-500/65 stroke-amber-300 hover:fill-amber-400/80';
            case 'vendida': return 'fill-rose-500/65 stroke-rose-400 hover:fill-rose-400/80';
            case 'bloqueada': return 'fill-slate-700/60 stroke-slate-500 hover:fill-slate-600/70';
          }
        }
        switch (estado) {
          case 'disponible': return 'fill-emerald-500/40 stroke-emerald-500 hover:fill-emerald-400/60';
          case 'contacto': return 'fill-sky-500/45 stroke-sky-400 hover:fill-sky-400/65';
          case 'cotizada': return 'fill-violet-500/60 stroke-violet-300 hover:fill-violet-400/75';
          case 'reservada': return 'fill-amber-500/60 stroke-amber-300 hover:fill-amber-400/75';
          case 'vendida': return 'fill-rose-500/60 stroke-rose-400 hover:fill-rose-400/75';
          case 'bloqueada': return 'fill-slate-700/60 stroke-slate-500 hover:fill-slate-600/70';
          default: return '';
        }
      };

      const el = React.createElement;

      return el('div', { className: 'flex h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden' },
        el('div', { className: 'flex-1 flex flex-col border-r border-slate-800 min-w-0' },
          
          // Encabezado con UF Automatizada
          el('header', { className: 'px-5 py-2.5 bg-slate-900 border-b border-slate-800 flex justify-between items-center gap-4' },
            el('div', null,
              el('div', { className: 'flex items-center gap-2.5' },
                el('h1', { className: 'text-lg font-bold tracking-tight text-white' }, 'Master Plan Inmobiliario — Huechuraba'),
                guardandoEnSheets && el('span', { className: 'text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-mono' }, '● Guardando y Notificando...')
              ),
              el('p', { className: 'text-xs text-indigo-300 font-medium' }, '34 duplex, 34 bodegas y 50 estacionamientos vendibles')
            ),
            el('div', { className: 'flex items-center gap-3' },
              el('div', { className: 'flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 text-xs' },
                el('span', { 
                  title: ufSincronizada ? 'Valor UF Oficial del Día' : 'Valor UF Manual',
                  className: `w-2 h-2 rounded-full ${ufSincronizada ? 'bg-emerald-400' : 'bg-amber-400'}`
                }),
                el('span', { className: 'text-slate-400 font-medium' }, 'UF Hoy: $'),
                el('input', {
                  type: 'number',
                  step: '0.01',
                  value: valorUF,
                  onChange: (ev) => {
                    setValorUF(Number(ev.target.value) || 0);
                    setUfSincronizada(false);
                  },
                  className: 'w-20 bg-transparent text-emerald-400 font-bold focus:outline-none font-mono'
                }),
                el('button', {
                  type: 'button',
                  onClick: obtenerUFDelDia,
                  title: 'Actualizar UF del día',
                  className: 'text-slate-400 hover:text-white ml-1 text-xs'
                }, cargandoUF ? '...' : '↻')
              ),
              el('button', {
                onClick: exportarACSV,
                className: 'px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold shadow transition-all'
              }, 'Exportar a sheets')
            )
          ),

          // Barra de Filtros Rápidos
          el('div', { className: 'px-5 py-2 bg-slate-900/90 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs' },
            el('div', { className: 'flex flex-wrap items-center gap-3' },
              el('div', { className: 'flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800' },
                el('button', {
                  onClick: () => setPlantaActiva('SUB'),
                  className: `px-2.5 py-1 font-semibold rounded ${plantaActiva === 'SUB' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`
                }, 'Subterráneo'),
                el('button', {
                  onClick: () => setPlantaActiva('P1'),
                  className: `px-2.5 py-1 font-semibold rounded ${plantaActiva === 'P1' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`
                }, 'Garden (P1-P2)'),

                unidadSeleccionada.tipo === 'Bodega' && el('div', null,
                  el('span', { className: 'text-slate-400 block' }, 'Ubicación:'),
                  el('p', { className: 'text-sm font-bold text-cyan-400 mt-0.5' }, 'Subterráneo S 01')
                )
              ),

              unidadSeleccionada.imgTipologia && el('div', { className: 'mt-3 bg-slate-950 p-2 rounded-lg border border-slate-800' },
                el('span', { className: 'text-[11px] font-semibold text-slate-400 block mb-1 uppercase' }, 'Planta Arquitectónica Asignada'),
                el('img', {
                  src: unidadSeleccionada.imgTipologia,
                  alt: unidadSeleccionada.nombreTipologia,
                  className: 'w-full h-36 object-contain rounded bg-white border border-slate-800'
                })
              ),

              // Botonera de Estados
              el('div', { className: 'mt-3 grid grid-cols-3 gap-2 text-[11px]' },
                [
                  { id: 'disponible', label: 'Disponible', color: 'bg-emerald-600 text-white' },
                  { id: 'contacto', label: 'Contacto Inicial', color: 'bg-sky-600 text-white' },
                  { id: 'cotizada', label: 'Cotizada', color: 'bg-violet-600 text-white' },
                  { id: 'reservada', label: 'Reservada', color: 'bg-amber-600 text-white' },
                  { id: 'vendida', label: 'Vendida', color: 'bg-rose-600 text-white' },
                  { id: 'bloqueada', label: 'Bloqueada', color: 'bg-slate-700 text-white' }
                ].map(st => 
                  el('button', {
                    key: st.id,
                    onClick: () => cambiarEstadoUnidad(st.id),
                    className: `py-1.5 px-1 rounded font-semibold transition-all text-center ${
                      unidadSeleccionada.estado === st.id 
                        ? `${st.color} shadow-lg ring-2 ring-white scale-[1.02]` 
                        : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                    }`
                  }, st.label)
                )
              )
            ),

            // Formulario de Lead y Envío
            el('form', { onSubmit: guardarLeadYDescargarPDF, className: 'space-y-3' },
              el('h3', { className: 'text-xs font-bold text-slate-200 uppercase tracking-wider' }, 'Ficha de Prospecto y Envío Comercial'),
              el('div', null,
                el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'Nombre Completo'),
                el('input', {
                  type: 'text',
                  required: true,
                  value: formLead.nombre,
                  onChange: ev => setFormLead({ ...formLead, nombre: ev.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500',
                  placeholder: 'Ej. Roberto Morales'
                })
              ),
              el('div', { className: 'grid grid-cols-2 gap-3' },
                el('div', null,
                  el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'RUT'),
                  el('input', {
                    type: 'text',
                    value: formLead.rut,
                    onChange: ev => setFormLead({ ...formLead, rut: ev.target.value }),
                    className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500',
                    placeholder: '12.345.678-9'
                  })
                ),
                el('div', null,
                  el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'Teléfono'),
                  el('input', {
                    type: 'text',
                    value: formLead.telefono,
                    onChange: ev => setFormLead({ ...formLead, telefono: ev.target.value }),
                    className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500',
                    placeholder: '+56 9...'
                  })
                )
              ),
              el('div', null,
                el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'Correo Electrónico (para despacho del PDF)'),
                el('input', {
                  type: 'email',
                  required: true,
                  value: formLead.email,
                  onChange: ev => setFormLead({ ...formLead, email: ev.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500',
                  placeholder: 'cliente@inversionista.cl'
                })
              ),
              el('div', null,
                el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'Etapa Comercial'),
                el('select', {
                  value: formLead.etapa,
                  onChange: ev => setFormLead({ ...formLead, etapa: ev.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500'
                },
                  el('option', { value: 'Contacto Inicial' }, 'Contacto Inicial'),
                  el('option', { value: 'Cotización' }, 'Cotización Emitida'),
                  el('option', { value: 'Evaluación Bancaria' }, 'Evaluación Bancaria'),
                  el('option', { value: 'Promesa Firmada' }, 'Promesa Firmada')
                )
              ),
              el('div', null,
                el('label', { className: 'text-xs text-slate-400 block mb-1' }, 'Observaciones Comerciales'),
                el('textarea', {
                  rows: 2,
                  value: formLead.observaciones,
                  onChange: ev => setFormLead({ ...formLead, observaciones: ev.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500',
                  placeholder: 'Bodega seleccionada, 2do estacionamiento, banco...'
                })
              ),
              el('button', {
                type: 'submit',
                disabled: generandoPDF,
                className: 'w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded text-xs transition-colors shadow disabled:opacity-50'
              }, generandoPDF ? 'Generando y Despachando Ficha...' : 'Guardar Ficha y Enviar al Cliente (PDF)')
            )
          ) : el('div', { className: 'flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500' },
            el('p', { className: 'text-base font-semibold text-slate-300' }, 'Sin Selección'),
            el('p', { className: 'text-xs mt-1.5 leading-relaxed text-slate-400' },
              'Haz clic sobre un departamento, estacionamiento o bodega en el plano para ver especificaciones, configurar bodega/estacionamientos y simular el financiamiento.'
            )
          )
        ),

        // PLANTILLA IMPRIMIBLE A4 OCULTA
        unidadSeleccionada && el('div', { style: { position: 'fixed', left: '-9999px', top: '0', zIndex: -100 } },
          el('div', { id: 'plantilla-ficha-pdf', style: { width: '190mm', padding: '9mm', fontFamily: 'Arial, sans-serif', color: '#111827', backgroundColor: '#ffffff' } },
            el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '2px solid #4f46e5', paddingBottom: '6px' } },
              el('div', null,
                el('h1', { style: { fontSize: '17px', fontWeight: 'bold', margin: 0, color: '#111827' } }, 'HORIZONTE NORTE — HUECHURABA'),
                el('p', { style: { fontSize: '9.5px', color: '#6b7280', margin: '2px 0 0 0' } }, 'Ficha Técnica y Simulación de Financiamiento')
              ),
              el('div', { style: { textAlign: 'right' } },
                el('span', { style: { fontSize: '15px', fontWeight: 'bold', color: '#4f46e5' } }, unidadSeleccionada.id),
                el('p', { style: { fontSize: '8.5px', color: '#6b7280', margin: '2px 0 0 0' } }, `Fecha: ${new Date().toLocaleDateString('es-CL')}`)
              )
            ),

            el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginTop: '10px' } },
              el('div', { style: { backgroundColor: '#f9fafb', padding: '8px 10px', borderRadius: '4px', border: '1px solid #e5e7eb' } },
                el('h3', { style: { fontSize: '9.5px', fontWeight: 'bold', margin: '0 0 4px 0', color: '#4f46e5', textTransform: 'uppercase' } }, 'Datos del Prospecto'),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'Nombre: '), formLead.nombre || 'No registrado'),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'RUT: '), formLead.rut || 'No registrado'),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'Teléfono: '), formLead.telefono || 'No registrado'),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'Email: '), formLead.email || 'No registrado')
              ),
              el('div', { style: { backgroundColor: '#f9fafb', padding: '8px 10px', borderRadius: '4px', border: '1px solid #e5e7eb' } },
                el('h3', { style: { fontSize: '9.5px', fontWeight: 'bold', margin: '0 0 4px 0', color: '#4f46e5', textTransform: 'uppercase' } }, 'Condiciones Comerciales'),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'Tipología: '), unidadSeleccionada.nombreTipologia || unidadSeleccionada.tipo),
                el('p', { style: { fontSize: '9.5px', margin: '2px 0' } }, el('strong', null, 'Superficie Útil: '), `${unidadSeleccionada.superficieUtil} m² | Exterior: ${unidadSeleccionada.metrajeExterior} m²`),
                el('div', { style: { borderTop: '1px solid #e5e7eb', marginTop: '3px', paddingTop: '3px', fontSize: '9px' } },
                  el('p', { style: { margin: '1px 0' } }, `• Depto: ${unidadSeleccionada.precioUF.toLocaleString('es-CL')} UF`),
                  el('p', { style: { margin: '1px 0' } }, `• Est. 1 (${unidadSeleccionada.estacionamientoAsignadoId} • ${calculosFinancieros.est1Info ? calculosFinancieros.est1Info.cubierta : ''}): ${calculosFinancieros.est} UF`),
                  unidadSeleccionada.segundoEstacionamientoId && el('p', { style: { margin: '1px 0', color: '#4f46e5', fontWeight: '600' } }, `• Est. 2 (${unidadSeleccionada.segundoEstacionamientoId} • ${calculosFinancieros.est2Info ? calculosFinancieros.est2Info.cubierta : ''}): ${calculosFinancieros.est2} UF`),
                  unidadSeleccionada.bodegaAsignadaId && el('p', { style: { margin: '1px 0' } }, `• Bodega (${unidadSeleccionada.bodegaAsignadaId} • ${calculosFinancieros.bodInfo ? calculosFinancieros.bodInfo.sup + ' m²' : ''}): ${calculosFinancieros.bod} UF`),
                  el('p', { style: { margin: '3px 0 0 0', fontWeight: 'bold', color: '#4f46e5', fontSize: '10.5px' } }, `Total Inversión: ${calculosFinancieros.total.toLocaleString('es-CL')} UF ($ ${calculosFinancieros.totalCLP.toLocaleString('es-CL')} CLP)`)
                )
              )
            ),

            el('div', { style: { marginTop: '10px', backgroundColor: '#eef2ff', padding: '8px 10px', borderRadius: '4px', border: '1px solid #c7d2fe' } },
              el('h3', { style: { fontSize: '9.5px', fontWeight: 'bold', margin: '0 0 5px 0', color: '#3730a3', textTransform: 'uppercase' } },
                'Estructura de Financiamiento y Crédito Hipotecario'
              ),
              el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', fontSize: '9px' } },
                el('div', { style: { borderRight: '1px solid #c7d2fe', paddingRight: '8px' } },
                  el('p', { style: { margin: '1px 0', fontWeight: 'bold', color: '#1e1b4b' } }, `Plan de Pie: ${pctPie}% (${calculosFinancieros.montoPieUF.toFixed(1)} UF)`),
                  el('p', { style: { margin: '1px 0' } }, `• Reserva Inicial: ${montoReservaUF} UF`),
                  el('p', { style: { margin: '1px 0' } }, `• Saldo Pie en Cuotas: ${calculosFinancieros.saldoPieUF.toFixed(1)} UF`),
                  el('p', { style: { margin: '3px 0 0 0', fontWeight: 'bold', color: '#4338ca' } }, `Cuota Mensual (${cuotasPie} meses): ${calculosFinancieros.cuotaMensualPieUF.toFixed(2)} UF/mes (~$ ${calculosFinancieros.cuotaMensualPieCLP.toLocaleString('es-CL')})`)
                ),
                el('div', { style: { paddingLeft: '4px' } },
                  el('p', { style: { margin: '1px 0', fontWeight: 'bold', color: '#1e1b4b' } }, `Crédito Hipotecario: ${100 - pctPie}% (${calculosFinancieros.montoCreditoUF.toFixed(1)} UF)`),
                  el('p', { style: { margin: '1px 0' } }, `• Plazo Crédito: ${plazoCreditoAnios} años | Tasa Ref: ${tasaHipotecarioAnual}% anual`),
                  el('p', { style: { margin: '1px 0', fontWeight: 'bold', color: '#047857' } }, `Dividendo Estimado: ${calculosFinancieros.dividendoUF.toFixed(2)} UF/mes (~$ ${calculosFinancieros.dividendoCLP.toLocaleString('es-CL')})`),
                  el('p', { style: { margin: '1px 0', fontWeight: 'bold', color: '#b45309' } }, `Renta Líquida Sugerida: $ ${calculosFinancieros.rentaSugeridaCLP.toLocaleString('es-CL')} CLP`)
                )
              )
            ),

            el('div', { style: { marginTop: '10px', textAlign: 'center' } },
              el('h3', { style: { fontSize: '9.5px', fontWeight: 'bold', margin: '0 0 5px 0', color: '#374151', textAlign: 'left', textTransform: 'uppercase' } },
                `Distribución Arquitectónica (${unidadSeleccionada.nombreTipologia})`
              ),
              dataUrlImagen ? el('img', {
                src: dataUrlImagen,
                alt: 'Tipología Arquitectónica',
                style: { width: '100%', maxHeight: '115mm', objectFit: 'contain', border: '1px solid #e5e7eb', borderRadius: '4px', display: 'block', margin: '0 auto' }
              }) : el('div', { style: { padding: '25px', border: '1px dashed #d1d5db', borderRadius: '4px', color: '#9ca3af', fontSize: '10px' } },
                'Lámina técnica en proceso de asignación.'
              )
            ),

            el('div', { style: { marginTop: '8px', borderTop: '1px solid #e5e7eb', paddingTop: '4px', fontSize: '7px', color: '#9ca3af', textAlign: 'justify' } },
              'Simulación referencial según valor UF del día ($' + valorUF.toLocaleString('es-CL') + '). Dividendos calculados bajo sistema francés de amortización con tasa referencial de mercado; no incluye seguros obligatorios. La aprobación final y exigencias de renta dependen de la evaluación de la institución financiera.'
            )
          )
        )
      );
    }

    window.addEventListener('DOMContentLoaded', function() {
      const contenedor = document.getElementById('root');
      if (contenedor && window.ReactDOM) {
        const root = ReactDOM.createRoot(contenedor);
        root.render(React.createElement(MasterPlanApp));
      }
    });
  </script>
</body>
</html>
